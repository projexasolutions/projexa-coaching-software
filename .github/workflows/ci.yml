name: Projexa CI
on:
  push:
    branches: [main, develop, "ui/**", "release/**"]
  pull_request:
    branches: [main, develop, "feat/phase-1-auth-access"]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static source and migration checks
        run: bash ./scripts-verify.sh

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: projexa_phase1
          POSTGRES_USER: projexa
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projexa -d projexa_phase1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PHASE1_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/projexa_phase1
      PHASE1_TEST_DATABASE_USERNAME: projexa
      PHASE1_TEST_DATABASE_PASSWORD: integration-test-only
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
