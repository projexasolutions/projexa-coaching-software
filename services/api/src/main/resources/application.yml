spring:
  application:
    name: projexa-coaching-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coaching}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  signup:
    verification-url: ${SIGNUP_VERIFICATION_URL:http://localhost:5173/verify-institute}
    verification-minutes: ${SIGNUP_VERIFICATION_MINUTES:30}
  mail:
    from: ${MAIL_FROM:no-reply@projexa.local}
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
